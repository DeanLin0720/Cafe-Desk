name: Release

# 推 v* tag 會自動建置並發佈；也可以在 Actions 頁手動指定既有 tag 重新建置（例如 v1.1.2）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要建置並發佈的既有 tag，例如 v1.1.2"
        required: true

permissions:
  contents: write       # 建立／更新 Release
  id-token: write       # 建置來源證明（attestation）
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 安裝相依套件
        run: python -m pip install PySide6 pyinstaller pytest

      - name: 確認 tag 與 __version__ 一致
        shell: bash
        run: |
          ver=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('cafe_desk/__init__.py',encoding='utf-8').read()).group(1))")
          echo "__version__=$ver  tag=$TAG"
          [ "v$ver" = "$TAG" ] || { echo "tag 與 __version__ 不一致"; exit 1; }

      - name: 測試
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I -m pytest -q

      - name: 打包
        run: pyinstaller --noconfirm CafeDesk.spec

      - name: 壓縮並產生 SHA256
        shell: bash
        run: |
          name="CafeDesk-${TAG}-win64.7z"
          (cd dist && 7z a -mx=9 "../$name" CafeDesk)
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: 擷取本版更新說明
        shell: bash
        run: |
          ver="${TAG#v}"
          awk -v v="$ver" '$0 ~ "^## "v"$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "此檔案由 GitHub Actions 從原始碼公開建置（[建置紀錄](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})）。"
            echo "可用 \`gh attestation verify ${ASSET} --repo ${GITHUB_REPOSITORY}\` 驗證檔案確實來自此倉庫的建置，SHA256 見 \`${ASSET}.sha256\`。"
          } >> notes.md

      - name: 建置來源證明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}

      - name: 發佈（已有同名 Release 則覆蓋檔案）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --title "Café Desk $TAG" --notes-file notes.md --verify-tag
          fi
